<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQL Query Frontend</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #374151;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f172a, #111827 50%, #1e293b);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 16px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      padding: 24px;
      backdrop-filter: blur(6px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.5;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 14px;
      font-size: 15px;
      line-height: 1.5;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: white;
      transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    button:hover { background: var(--accent-hover); }
    button:active { transform: translateY(1px); }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--muted);
      min-height: 48px;
      display: flex;
      align-items: center;
    }

    .status.error { color: #fecaca; border-color: rgba(239, 68, 68, 0.45); }
    .status.success { color: #bbf7d0; border-color: rgba(34, 197, 94, 0.45); }

    .table-wrap {
      margin-top: 24px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.02);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    th {
      background: rgba(255,255,255,0.04);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    .schema-overview {
      padding: 16px;
      display: grid;
      gap: 18px;
    }

    .schema-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.03);
    }

    .schema-card h2 {
      margin: 0;
      padding: 14px 16px;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid var(--border);
    }

    .schema-card table {
      min-width: 700px;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.85rem;
      color: var(--text);
    }

    @media (max-width: 800px) {
      .row {
        grid-template-columns: 1fr;
      }

      .controls {
        flex-direction: row;
        flex-wrap: wrap;
      }

      button {
        flex: 1 1 180px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Database Query Frontend</h1>
      <p>Write a SQL query, send it, and view the returned rows in a table.</p>

      <div class="row">
        <textarea id="sqlInput" placeholder="Write your SQL query here..."></textarea>

        <div class="controls">
          <button id="sendBtn">Send query</button>
          <button id="overviewBtn" class="secondary" type="button">Show table overview</button>
          <button id="clearBtn" class="secondary" type="button">Clear results</button>
          <button id="recreateBtn" class="secondary" type="button">Recreate tables</button>
        </div>
      </div>

      <div id="status" class="status">Ready.</div>

      <div class="table-wrap" id="tableWrap">
        <div class="empty">No results yet.</div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:8000';
    const API_URL = `${API_BASE_URL}/query`;

    const sqlInput = document.getElementById('sqlInput');
    const sendBtn = document.getElementById('sendBtn');
    const overviewBtn = document.getElementById('overviewBtn');
    const clearBtn = document.getElementById('clearBtn');
    const recreateBtn = document.getElementById('recreateBtn');
    const statusBox = document.getElementById('status');
    const tableWrap = document.getElementById('tableWrap');

    let userSchemaName = sessionStorage.getItem('userSchemaName');

    if (!userSchemaName) {
      userSchemaName = generateUserSchemaName();
      sessionStorage.setItem('userSchemaName', userSchemaName);
    }

    initSession();

    function generateUserSchemaName() {
      const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let schemaName = '';

      for (let numberOfCharacters = 0; numberOfCharacters < 20; numberOfCharacters++) {
        schemaName += characters.charAt(Math.floor(Math.random() * characters.length));
      }

      return schemaName;
    }

    function setStatus(message, type = '') {
      statusBox.textContent = message;
      statusBox.className = `status ${type}`.trim();
    }

    function clearResults() {
      tableWrap.innerHTML = '<div class="empty">No results yet.</div>';
      setStatus('Results cleared.');
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function getSqlAction(sql) {
      const cleanedSql = sql
        .trim()
        .replaceAll(String.fromCharCode(10), ' ')
        .replaceAll(String.fromCharCode(13), ' ')
        .replaceAll(String.fromCharCode(9), ' ');

      const words = cleanedSql.split(' ').filter(Boolean);
      const firstWord = words[0] ? words[0].toUpperCase() : 'QUERY';

      if (firstWord === 'WITH') return 'SELECT';
      return firstWord;
    }

    function getActionStartMessage(action) {
      const messages = {
        SELECT: 'Fetching rows from the database...',
        SHOW: 'Fetching database information...',
        DESCRIBE: 'Fetching table structure...',
        DESC: 'Fetching table structure...',
        INSERT: 'Sending INSERT query...',
        UPDATE: 'Sending UPDATE query...',
        DELETE: 'Sending DELETE query...',
        CREATE: 'Sending CREATE query...',
        ALTER: 'Sending ALTER query...',
        DROP: 'Sending DROP query...',
        TRUNCATE: 'Sending TRUNCATE query...',
        USE: 'Switching database/schema...'
      };

      return messages[action] || 'Sending SQL query...';
    }

    function getActionSuccessMessage(action, normalized) {
      const rowCount = normalized.rows.length;
      const affectedRows = normalized.affectedRows;

      if (['SELECT', 'SHOW', 'DESCRIBE', 'DESC'].includes(action)) {
        return `Query completed. Returned ${rowCount} row(s).`;
      }

      if (['INSERT', 'UPDATE', 'DELETE', 'REPLACE'].includes(action)) {
        if (typeof affectedRows === 'number') {
          return `${action} completed. ${affectedRows} row(s) affected.`;
        }

        return `${action} query completed successfully.`;
      }

      if (['CREATE', 'ALTER', 'DROP', 'TRUNCATE'].includes(action)) {
        return `${action} query completed successfully.`;
      }

      if (rowCount > 0) {
        return `Query completed. Returned ${rowCount} row(s).`;
      }

      return 'Query completed successfully.';
    }

    function normalizeResponse(data) {
      if (Array.isArray(data)) {
        return {
          columns: data[0] ? data[0].map((_, index) => `Column ${index + 1}`) : [],
          rows: data,
          affectedRows: null,
          raw: data
        };
      }

      if (data && Array.isArray(data.results)) {
        return {
          columns: data.results[0] ? data.results[0].map((_, index) => `Column ${index + 1}`) : [],
          rows: data.results,
          affectedRows: data.affected_rows ?? data.affectedRows ?? data.rowcount ?? null,
          raw: data
        };
      }

      if (data && Array.isArray(data.rows)) {
        return {
          columns: Array.isArray(data.columns)
            ? data.columns
            : (data.rows[0] ? data.rows[0].map((_, index) => `Column ${index + 1}`) : []),
          rows: data.rows,
          affectedRows: data.affected_rows ?? data.affectedRows ?? data.rowcount ?? null,
          raw: data
        };
      }

      return {
        columns: [],
        rows: [],
        affectedRows: data?.affected_rows ?? data?.affectedRows ?? data?.rowcount ?? null,
        raw: data
      };
    }

    function renderTable(columns, rows) {
      const safeColumns = Array.isArray(columns) ? columns : [];
      const safeRows = Array.isArray(rows) ? rows : [];

      if (safeColumns.length === 0 && safeRows.length === 0) {
        tableWrap.innerHTML = '<div class="empty">Query executed, but no rows were returned.</div>';
        return;
      }

      let html = '<table><thead><tr>';

      if (safeColumns.length > 0) {
        safeColumns.forEach(column => {
          html += `<th>${escapeHtml(column)}</th>`;
        });
      } else if (safeRows[0]) {
        safeRows[0].forEach((_, index) => {
          html += `<th>Column ${index + 1}</th>`;
        });
      }

      html += '</tr></thead><tbody>';

      safeRows.forEach(row => {
        const rowValues = Array.isArray(row) ? row : [row];
        html += '<tr>';

        rowValues.forEach(value => {
          html += `<td>${escapeHtml(value ?? '')}</td>`;
        });

        html += '</tr>';
      });

      html += '</tbody></table>';
      tableWrap.innerHTML = html;
    }

    async function initSession() {
      setStatus('Initializing your database session...');

      try {
        const schemaName = sessionStorage.getItem('userSchemaName');

        if (!schemaName) return;

        const response = await fetch(
          `${API_BASE_URL}/session/init?userSchemaName=${encodeURIComponent(schemaName)}`,
          { method: 'POST' }
        );

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`HTTP ${response.status}: ${errorText || 'Session init failed'}`);
        }

        const data = await response.json();
        console.log('Schema opprettet:', data);
        registerSchema({ silent: true });
        setStatus('Database session ready.', 'success');
      } catch (err) {
        console.error('Feil ved oppretting av schema:', err);
        setStatus(`Could not initialize session/schema: ${err.message}`, 'error');
      }
    }

    async function runApiQuery(sql) {
      const schemaName = sessionStorage.getItem('userSchemaName');

      if (!schemaName) {
        throw new Error('Missing user schema name. Refresh the page and try again.');
      }

      registerSchema({ silent: true });

      const response = await fetch(
        `${API_URL}?sql=${encodeURIComponent(sql)}&userSchemaName=${encodeURIComponent(schemaName)}`,
        { method: 'GET' }
      );

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`HTTP ${response.status}: ${errorText || 'Request failed'}`);
      }

      const data = await response.json();
      return normalizeResponse(data);
    }

    async function sendQuery() {
      const sql = sqlInput.value.trim();

      if (!sql) {
        setStatus('Please write a SQL query first.', 'error');
        return;
      }

      const action = getSqlAction(sql);

      sendBtn.disabled = true;
      setStatus(getActionStartMessage(action));

      try {
        const normalized = await runApiQuery(sql);
        renderTable(normalized.columns, normalized.rows);
        setStatus(getActionSuccessMessage(action, normalized), 'success');
      } catch (error) {
        console.error(error);
        setStatus(`${action} failed: ${error.message}`, 'error');
      } finally {
        sendBtn.disabled = false;
      }
    }

    function renderDatabaseOverview(rows) {
      if (!Array.isArray(rows) || rows.length === 0) {
        tableWrap.innerHTML = '<div class="empty">No tables found.</div>';
        return;
      }

      const tables = {};

      rows.forEach(row => {
        const tableName = row[0];

        if (!tables[tableName]) {
          tables[tableName] = [];
        }

        tables[tableName].push({
          columnName: row[1],
          columnType: row[2],
          nullable: row[3],
          key: row[4],
          defaultValue: row[5],
          extra: row[6]
        });
      });

      let html = '<div class="schema-overview">';

      Object.entries(tables).forEach(([tableName, columns]) => {
        html += `
          <section class="schema-card">
            <h2>${escapeHtml(tableName)} <span class="badge">${columns.length} column(s)</span></h2>
            <table>
              <thead>
                <tr>
                  <th>Column</th>
                  <th>Type</th>
                  <th>Nullable</th>
                  <th>Key</th>
                  <th>Default</th>
                  <th>Extra</th>
                </tr>
              </thead>
              <tbody>
        `;

        columns.forEach(column => {
          html += `
            <tr>
              <td><strong>${escapeHtml(column.columnName)}</strong></td>
              <td>${escapeHtml(column.columnType)}</td>
              <td>${escapeHtml(column.nullable)}</td>
              <td>${escapeHtml(column.key || '')}</td>
              <td>${escapeHtml(column.defaultValue ?? '')}</td>
              <td>${escapeHtml(column.extra || '')}</td>
            </tr>
          `;
        });

        html += `
              </tbody>
            </table>
          </section>
        `;
      });

      html += '</div>';
      tableWrap.innerHTML = html;
    }

    async function showTableOverview() {
      overviewBtn.disabled = true;
      setStatus('Fetching table overview...');

      try {
        const sql = `
          SELECT
            table_name,
            column_name,
            column_type,
            is_nullable,
            column_key,
            column_default,
            extra
          FROM information_schema.columns
          WHERE table_schema = DATABASE()
          ORDER BY table_name, ordinal_position;
        `;

        const normalized = await runApiQuery(sql);
        renderDatabaseOverview(normalized.rows);

        const tableCount = new Set(normalized.rows.map(row => row[0])).size;
        setStatus(`Table overview loaded. Found ${tableCount} table(s).`, 'success');
      } catch (error) {
        console.error(error);
        setStatus(`Could not fetch table overview: ${error.message}`, 'error');
      } finally {
        overviewBtn.disabled = false;
      }
    }

    async function recreateTables() {
      const schemaName = sessionStorage.getItem('userSchemaName');

      if (!schemaName) {
        setStatus('Missing user schema name. Refresh the page and try again.', 'error');
        return;
      }

      recreateBtn.disabled = true;
      setStatus('Recreating tables from the selected SQL file...');

      try {
        const res = await fetch(
          `${API_BASE_URL}/session/recreate?userSchemaName=${encodeURIComponent(schemaName)}`,
          { method: 'POST' }
        );

        if (!res.ok) {
          const errorText = await res.text();
          throw new Error(`HTTP ${res.status}: ${errorText || 'Recreate failed'}`);
        }

        const data = await res.json();

        if (data.ok) {
          tableWrap.innerHTML = '<div class="empty">Tables recreated. Run a query or show table overview.</div>';
          setStatus('Tables recreated successfully from the selected SQL file.', 'success');
        } else {
          setStatus('Recreate request finished, but backend did not confirm success.', 'error');
        }
      } catch (err) {
        console.error(err);
        setStatus(`Could not recreate tables: ${err.message}`, 'error');
      } finally {
        recreateBtn.disabled = false;
      }
    }

    async function registerSchema(options = {}) {
      const { silent = true } = options;
      const schemaName = sessionStorage.getItem('userSchemaName');

      if (!schemaName) return;

      try {
        const response = await fetch(
          `${API_BASE_URL}/register-schema?userSchemaName=${encodeURIComponent(schemaName)}`,
          { method: 'POST' }
        );

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`HTTP ${response.status}: ${errorText || 'Heartbeat failed'}`);
        }

        if (!silent) {
          setStatus('Session refreshed. Your schema is still active.', 'success');
        }
      } catch (err) {
        console.warn('Heartbeat failed:', err);

        if (!silent) {
          setStatus(`Could not refresh session: ${err.message}`, 'error');
        }
      }
    }

    sendBtn.addEventListener('click', sendQuery);
    overviewBtn.addEventListener('click', showTableOverview);
    clearBtn.addEventListener('click', clearResults);
    recreateBtn.addEventListener('click', recreateTables);

    sqlInput.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
        sendQuery();
      }
    });

    registerSchema({ silent: true });
    setInterval(() => registerSchema({ silent: true }), 5000);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        registerSchema({ silent: false });
      }
    });

    window.addEventListener('focus', () => {
      registerSchema({ silent: false });
    });
  </script>
</body>
</html>
